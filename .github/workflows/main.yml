name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download VexFlow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Sources/Vendor
          curl -fL --retry 3 --retry-delay 2 \
            "https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js" \
            -o Sources/Vendor/vexflow.js
          test -s Sources/Vendor/vexflow.js

      - name: Download 49 direct piano samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Sources/Audio
          python3 - <<'PY2'
          import os, urllib.request

          base = "https://cdn.jsdelivr.net/npm/tonejs-instrument-piano-mp3@1.1.2"
          names = ['C','Cs','D','Ds','E','F','Fs','G','Gs','A','As','B']

          for midi in range(36, 85):
              note = names[midi % 12]
              octave = midi // 12 - 1
              source_name = f"{note}{octave}.mp3"
              url = f"{base}/{source_name}"
              dst = f"Sources/Audio/midi_{midi}.mp3"
              print(f"MIDI {midi} <- {source_name}")
              urllib.request.urlretrieve(url, dst)
              if os.path.getsize(dst) <= 1000:
                  raise RuntimeError(f"Invalid sample: {dst}")

          files = sorted(f for f in os.listdir('Sources/Audio') if f.endswith('.mp3'))
          expected = [f"midi_{m}.mp3" for m in range(36, 85)]
          if files != expected:
              raise RuntimeError(f"Wrong sample set: {files}")
          print("Verified exact MIDI-to-file mapping for 49 notes (36...84).")
          PY2

          COUNT=$(find Sources/Audio -maxdepth 1 -name 'midi_*.mp3' | wc -l | tr -d ' ')
          test "$COUNT" = "49"

          UNIQUE=$(shasum -a 256 Sources/Audio/midi_*.mp3 | awk '{print $1}' | sort -u | wc -l | tr -d ' ')
          test "$UNIQUE" = "49"
          echo "Verified 49 distinct piano sample files."

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPad without signing
        run: |
          xcodebuild \
            -project SightReadingTrainer.xcodeproj \
            -scheme SightReadingTrainer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Copy runtime assets into app
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/SightReadingTrainer.app"
          test -d "$APP"
          cp Sources/Vendor/vexflow.js "$APP/vexflow.js"
          cp Sources/Audio/*.mp3 "$APP/"

      - name: Verify notation and audio assets
        shell: bash
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/SightReadingTrainer.app"
          test -s "$APP/notation.html"
          test -s "$APP/vexflow.js"
          for MIDI in $(seq 36 84); do
            test -s "$APP/midi_${MIDI}.mp3"
          done
          COUNT=$(find "$APP" -maxdepth 1 -name 'midi_*.mp3' | wc -l | tr -d ' ')
          test "$COUNT" = "49"
          echo "Verified VexFlow and 49 direct piano samples inside app bundle."

      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SightReadingTrainer.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload SightReadingTrainer-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SightReadingTrainer-unsigned-IPA
          path: SightReadingTrainer-unsigned.ipa

<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827}
#root{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
svg{width:100%;height:100%;display:block}
.small{font-size:11px;fill:#6b7280}.title{font-weight:700;font-size:15px;fill:#111827}.measureNo{font-size:10px;fill:#6b7280}
</style>
</head>
<body><div id="root"></div>
<script>
(function(){
  let song=null;
  const NS='http://www.w3.org/2000/svg';
  function el(tag,attrs,text){const n=document.createElementNS(NS,tag); if(attrs) Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,String(v))); if(text!=null)n.textContent=text; return n;}
  function diatonic(p){const order={C:0,D:1,E:2,F:3,G:4,A:5,B:6}; return p.octave*7+order[p.step];}
  function yForPitch(p,staff,top){
    // 5 px per staff step. Treble bottom line E4; bass bottom line G2.
    const bottom=staff==='treble'? (4*7+2):(2*7+4);
    const bottomY=top+40;
    return bottomY-(diatonic(p)-bottom)*5;
  }
  function accidentalGlyph(a){return a==='n'?'♮':a==='#'?'♯':a==='b'?'♭':'';}
  function drawStaff(svg,x,y,w,clef,showKey){
    for(let i=0;i<5;i++) svg.appendChild(el('line',{x1:x,y1:y+i*10,x2:x+w,y2:y+i*10,stroke:'#111827','stroke-width':1}));
    svg.appendChild(el('text',{x:x+5,y:y+35,'font-size':clef==='treble'?43:39,'font-family':'serif'},clef==='treble'?'𝄞':'𝄢'));
    if(showKey){
      if(clef==='treble'){
        svg.appendChild(el('text',{x:x+45,y:y+19,'font-size':20,'font-family':'serif'},'♯'));
        svg.appendChild(el('text',{x:x+57,y:y+34,'font-size':20,'font-family':'serif'},'♯'));
      }else{
        svg.appendChild(el('text',{x:x+45,y:y+29,'font-size':20,'font-family':'serif'},'♯'));
        svg.appendChild(el('text',{x:x+57,y:y+44,'font-size':20,'font-family':'serif'},'♯'));
      }
    }
  }
  function drawLedger(svg,x,y,staffTop){
    const bottom=staffTop+40, top=staffTop;
    if(y<top-1){for(let ly=top-10;ly>=y-2;ly-=10)svg.appendChild(el('line',{x1:x-9,y1:ly,x2:x+9,y2:ly,stroke:'#111827','stroke-width':1}));}
    if(y>bottom+1){for(let ly=bottom+10;ly<=y+2;ly+=10)svg.appendChild(el('line',{x1:x-9,y1:ly,x2:x+9,y2:ly,stroke:'#111827','stroke-width':1}));}
  }
  function drawNoteHead(svg,x,y,dur){
    const filled=dur<=1.001;
    svg.appendChild(el('ellipse',{cx:x,cy:y,rx:6.2,ry:4.3,fill:filled?'#111827':'white',stroke:'#111827','stroke-width':1.5,transform:`rotate(-14 ${x} ${y})`}));
    if(dur<=3.001){
      const stemUp=y>75;
      svg.appendChild(el('line',{x1:stemUp?x+5:x-5,y1:y,x2:stemUp?x+5:x-5,y2:stemUp?y-31:y+31,stroke:'#111827','stroke-width':1.4}));
    }
    if(dur>2.5) svg.appendChild(el('circle',{cx:x+11,cy:y, r:1.8, fill:'#111827'}));
  }
  function drawRest(svg,x,staffTop,dur){
    const y=staffTop+20;
    if(dur>=2.9){ svg.appendChild(el('rect',{x:x-7,y:y-5,width:14,height:4,fill:'#111827'})); svg.appendChild(el('circle',{cx:x+10,cy:y-3,r:1.5,fill:'#111827'})); }
    else if(dur>=1.9) svg.appendChild(el('rect',{x:x-7,y:y,width:14,height:4,fill:'#111827'}));
    else svg.appendChild(el('text',{x:x-5,y:y+7,'font-size':22,'font-family':'serif'},'𝄽'));
  }
  function drawEvent(svg,event,mx,mw,trebleTop,bassTop){
    const x=mx+82+(event.offset/3)*(mw-94);
    const top=event.staff==='bass'?bassTop:trebleTop;
    if(event.type==='rest'){drawRest(svg,x,top,event.durationBeats);return;}
    const pitches=event.pitches||[];
    pitches.forEach((p,i)=>{
      const y=yForPitch(p,event.staff,top); drawLedger(svg,x,y,top); drawNoteHead(svg,x+(i%2?1:0),y,event.durationBeats);
      const acc=p.displayAccidental|| (p.forcedAccidental?p.accidental:null);
      if(acc) svg.appendChild(el('text',{x:x-18,y:y+6,'font-size':18,'font-family':'serif'},accidentalGlyph(acc)));
      if(event.tieStart){svg.appendChild(el('path',{d:`M ${x+4} ${y+7} Q ${x+18} ${y+16} ${x+31} ${y+7}`,fill:'none',stroke:'#111827','stroke-width':1.1}));}
      if(event.tieStop){svg.appendChild(el('path',{d:`M ${x-31} ${y+7} Q ${x-17} ${y+16} ${x-4} ${y+7}`,fill:'none',stroke:'#111827','stroke-width':1.1}));}
    });
  }
  function renderSystem(svg,measures,startMeasure,y,w,currentMeasure,currentOffset){
    const left=28, right=20, systemW=w-left-right, per=systemW/4;
    const trebleTop=y+25, bassTop=y+112;
    for(let i=0;i<4;i++){
      const no=startMeasure+i; if(no>song.measureCount) break;
      const m=measures[no-1], mx=left+i*per, mw=per;
      drawStaff(svg,mx,trebleTop,mw,'treble',i===0); drawStaff(svg,mx,bassTop,mw,'bass',i===0);
      svg.appendChild(el('line',{x1:mx,y1:trebleTop,x2:mx,y2:bassTop+40,stroke:'#111827','stroke-width':i===0?1.4:1}));
      svg.appendChild(el('line',{x1:mx+mw,y1:trebleTop,x2:mx+mw,y2:bassTop+40,stroke:'#111827','stroke-width':1}));
      svg.appendChild(el('text',{x:mx+5,y:trebleTop-8,class:'measureNo'},String(no)));
      Object.values(m.voices).forEach(events=>events.forEach(ev=>drawEvent(svg,ev,mx,mw,trebleTop,bassTop)));
      if(no===currentMeasure){
        const cx=mx+82+(currentOffset/3)*(mw-94);
        svg.appendChild(el('line',{x1:cx,y1:trebleTop-10,x2:cx,y2:bassTop+51,stroke:'#d97706','stroke-width':2.5,'stroke-linecap':'round',opacity:.9}));
        svg.appendChild(el('polygon',{points:`${cx-5},${trebleTop-13} ${cx+5},${trebleTop-13} ${cx},${trebleTop-5}`,fill:'#d97706'}));
      }
    }
  }
  function doRender(activeIndex){
    if(!song) return;
    const root=document.getElementById('root'); root.innerHTML='';
    const w=Math.max(720,window.innerWidth||900), h=Math.max(440,window.innerHeight||580);
    const svg=el('svg',{viewBox:`0 0 ${w} ${h}`,preserveAspectRatio:'xMidYMid meet'}); root.appendChild(svg);
    const group=song.attackGroups[Math.min(activeIndex,song.attackGroups.length-1)]||{measure:song.measureCount,offsetBeats:0};
    const currentMeasure=group.measure, currentOffset=group.offsetBeats;
    let start=Math.floor((currentMeasure-1)/4)*4+1;
    if(start+7>song.measureCount) start=Math.max(1,song.measureCount-7);
    svg.appendChild(el('text',{x:28,y:24,class:'title'},`${song.title} · ${song.composer}`));
    svg.appendChild(el('text',{x:w-28,y:24,class:'small','text-anchor':'end'},`3/4   ♩ = 76   현재 ${currentMeasure}마디`));
    renderSystem(svg,song.measures,start,42,w,currentMeasure,currentOffset);
    renderSystem(svg,song.measures,start+4,242,w,currentMeasure,currentOffset);
  }
  fetch('gymnopedie_no1_sightreading_v1.json').then(r=>r.json()).then(d=>{song=d;doRender(0);}).catch(e=>{document.getElementById('root').textContent='악보 데이터 로딩 오류: '+e;});
  window.renderSightScore=function(activeIndex){doRender(activeIndex||0);return 'ok';};
  window.addEventListener('resize',()=>doRender(0));
})();
</script></body></html>

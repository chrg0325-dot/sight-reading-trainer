:"A","alter":0,"octave":1,"midi":33,"vexKey":"a/1","accidental":null,"name":"A1","forcedAccidental":false,"displayAccidental":null},{"step":"G","alter":0,"octave":2,"midi":43,"vexKey":"g/2","accidental":null,"name":"G2","forcedAccidental":false,"displayAccidental":null}],"tieStart":false,"tieStop":false}]}},{"number":78,"timeSignature":{"beats":3,"beatType":4},"voices":{"rhMelody":[{"type":"chord","offset":0.0,"durationBeats":3.0,"staff":"treble","voice":"rhMelody","pitches":[{"step":"D","alter":0,"octave":4,"midi":62,"vexKey":"d/4","accidental":null,"name":"D4","forcedAccidental":false,"displayAccidental":null},{"step":"F","alter":0,"octave":4,"midi":65,"vexKey":"f/4","accidental":null,"name":"F4","forcedAccidental":false,"displayAccidental":"n"},{"step":"A","alter":0,"octave":4,"midi":69,"vexKey":"a/4","accidental":null,"name":"A4","forcedAccidental":false,"displayAccidental":null},{"step":"D","alter":0,"octave":5,"midi":74,"vexKey":"d/5","accidental":null,"name":"D5","forcedAccidental":false,"displayAccidental":null}],"tieStart":false,"tieStop":false}],"accompaniment":[{"type":"rest","offset":0.0,"durationBeats":3.0,"staff":"treble","voice":"accompaniment","tieStart":false,"tieStop":false}],"lhBass":[{"type":"chord","offset":0.0,"durationBeats":3.0,"staff":"bass","voice":"lhBass","pitches":[{"step":"D","alter":0,"octave":1,"midi":26,"vexKey":"d/1","accidental":null,"name":"D1","forcedAccidental":false,"displayAccidental":null},{"step":"A","alter":0,"octave":1,"midi":33,"vexKey":"a/1","accidental":null,"name":"A1","forcedAccidental":false,"displayAccidental":null},{"step":"D","alter":0,"octave":2,"midi":38,"vexKey":"d/2","accidental":null,"name":"D2","forcedAccidental":false,"displayAccidental":null}],"tieStart":false,"tieStop":false}]}}]};
const VF=Vex.Flow;
let currentActiveIndex=0;

const SYSTEM_MEASURES=5;
const SYSTEMS_VISIBLE=2;
const STAFF_GAP=78;
const SYSTEM_GAP=222;

function durCode(beats,isRest){
  const b=Number(beats);
  if(Math.abs(b-3)<0.01) return isRest?'wr':'hd';
  if(Math.abs(b-2)<0.01) return isRest?'hr':'h';
  if(Math.abs(b-1)<0.01) return isRest?'qr':'q';
  if(Math.abs(b-1.5)<0.01) return isRest?'qdr':'qd';
  if(Math.abs(b-0.5)<0.01) return isRest?'8r':'8';
  return isRest?'qr':'q';
}
function stemFor(voice){
  if(voice==='lhBass') return -1;
  if(voice==='bassUpper') return 1;
  if(voice==='accompaniment') return -1;
  return 1;
}
function noteFromEvent(ev,voiceId){
  const isRest=ev.type==='rest';
  const keys=isRest?['b/4']:(ev.pitches||[]).map(p=>p.vexKey);
  const n=new VF.StaveNote({
    clef:ev.staff==='bass'?'bass':'treble',
    keys:keys,
    duration:durCode(ev.durationBeats,isRest),
    stem_direction:stemFor(voiceId),
    auto_stem:false
  });
  n.__sr={event:ev,voiceId:voiceId};
  if(isRest && Number(ev.durationBeats)>=2.99){
    try{ n.setCenterAlignment(true); }catch(_){ }
  }
  if(!isRest){
    (ev.pitches||[]).forEach((p,i)=>{
      const a=p.displayAccidental || (p.forcedAccidental ? p.accidental : null);
      if(a){ try{ n.addModifier(new VF.Accidental(a),i); }catch(_){ } }
    });
    if(Math.abs(Number(ev.durationBeats)-3)<0.01 || Math.abs(Number(ev.durationBeats)-1.5)<0.01){
      try{ VF.Dot.buildAndAttach([n],{all:true}); }catch(_){ }
    }
  }
  return n;
}
function voiceForEvents(events,voiceId){
  const notes=events.map(ev=>noteFromEvent(ev,voiceId));
  const v=new VF.Voice({num_beats:3,beat_value:4});
  v.setStrict(false); v.addTickables(notes);
  return {voice:v,notes:notes};
}
function addSystemHeader(treble,bass,isFirstSystem){
  treble.addClef('treble').addKeySignature('D');
  bass.addClef('bass').addKeySignature('D');
  if(isFirstSystem){
    treble.addTimeSignature('3/4');
    bass.addTimeSignature('3/4');
  }
}
function dynamicAt(measure){
  return (song.annotations && song.annotations.dynamics || []).filter(d=>d.measure===measure);
}
function addDynamic(ctx,stave,measure,which){
  const arr=dynamicAt(measure).filter(d=>{
    if(which==='treble') return d.voice==='rhMelody'||d.voice==='accompaniment';
    return d.voice==='lhBass'||d.voice==='bassUpper'||(d.voice==='accompaniment' && measure>=19);
  });
  if(!arr.length) return;
  const txt=arr[0].mark;
  const x=stave.getNoteStartX()+4;
  const y=which==='treble'?stave.getYForBottomText(0):stave.getYForBottomText(0);
  try{ctx.save();ctx.setFont('Times New Roman',15,'bold italic');ctx.fillText(txt,x,y);ctx.restore();}catch(_){ }
}
function makeMeasure(ctx,x,y,w,number,isSystemStart,isFirstSystem,registry){
  const treble=new VF.Stave(x,y,w);
  const bass=new VF.Stave(x,y+STAFF_GAP,w);
  if(isSystemStart) addSystemHeader(treble,bass,isFirstSystem);
  if(!isSystemStart){
    treble.setBegBarType(VF.Barline.type.NONE);
    bass.setBegBarType(VF.Barline.type.NONE);
  }
  treble.setContext(ctx).draw(); bass.setContext(ctx).draw();
  if(isSystemStart){
    try{new VF.StaveConnector(treble,bass).setType(VF.StaveConnector.type.BRACE).setContext(ctx).draw();}catch(_){ }
    try{new VF.StaveConnector(treble,bass).setType(VF.StaveConnector.type.SINGLE_LEFT).setContext(ctx).draw();}catch(_){ }
  }
  try{new VF.StaveConnector(treble,bass).setType(VF.StaveConnector.type.SINGLE_RIGHT).setContext(ctx).draw();}catch(_){ }

  const m=song.measures[number-1];
  const bundles=[];
  const voiceEntries=[];
  Object.keys(m.voices).forEach(voiceId=>{
    const events=m.voices[voiceId]; if(!events||!events.length) return;
    const b=voiceForEvents(events,voiceId); bundles.push(b); voiceEntries.push({voiceId,events,bundle:b});
  });
  const voices=bundles.map(b=>b.voice);
  if(voices.length){
    const formatter=new VF.Formatter();
    try{ formatter.joinVoices(voices); }catch(_){ }
    formatter.format(voices,Math.max(36,w-(treble.getNoteStartX()-x)-18));
    voiceEntries.forEach(entry=>{
      const staff=entry.events[0].staff==='bass'?bass:treble;
      entry.bundle.voice.draw(ctx,staff);
      entry.events.forEach((ev,i)=>{
        registry.push({measure:number,offset:Number(ev.offset),event:ev,note:entry.bundle.notes[i],voiceId:entry.voiceId});
      });
    });
  }

  if(isSystemStart){
    try{ctx.save();ctx.setFont('Arial',10,'normal');ctx.setFillStyle('#6b7280');ctx.fillText(String(number),x+4,y-8);ctx.restore();}catch(_){ }
  }
  addDynamic(ctx,treble,number,'treble');
  return {treble,bass};
}
function eventX(registry,measure,offset,fallback){
  const candidates=registry.filter(r=>r.measure===measure && Math.abs(r.offset-offset)<0.01 && r.event.type!=='rest');
  if(!candidates.length) return fallback;
  try{return candidates[0].note.getAbsoluteX();}catch(_){return fallback;}
}
function drawTies(ctx,registry){
  const byVoice={};
  registry.forEach(r=>{(byVoice[r.voiceId]||(byVoice[r.voiceId]=[])).push(r);});
  Object.values(byVoice).forEach(list=>{
    list.sort((a,b)=>a.measure-b.measure||a.offset-b.offset);
    for(let i=0;i<list.length-1;i++){
      const a=list[i], b=list[i+1];
      if(!a.event.tieStart || !b.event.tieStop || a.event.type==='rest'||b.event.type==='rest') continue;
      const ac=(a.event.pitches||[]).length, bc=(b.event.pitches||[]).length, n=Math.min(ac,bc);
      if(!n) continue;
      try{new VF.StaveTie({first_note:a.note,last_note:b.note,first_indices:Array.from({length:n},(_,k)=>k),last_indices:Array.from({length:n},(_,k)=>k)}).setContext(ctx).draw();}catch(_){ }
    }
  });
}
function render(activeIndex){
  currentActiveIndex=Math.max(0,Math.min(Number(activeIndex)||0,song.attackGroups.length-1));
  const root=document.getElementById('score'); root.innerHTML=''; document.getElementById('error').style.display='none';
  const width=Math.max(760,window.innerWidth||900);
  const height=Math.max(465,window.innerHeight||560);
  const renderer=new VF.Renderer(root,VF.Renderer.Backends.SVG); renderer.resize(width,height);
  const ctx=renderer.getContext(); ctx.setFillStyle('#111827'); ctx.setStrokeStyle('#111827');

  const group=song.attackGroups[currentActiveIndex]||{measure:1,offsetBeats:0};
  const blockSize=SYSTEM_MEASURES*SYSTEMS_VISIBLE;
  let blockStart=Math.floor((group.measure-1)/blockSize)*blockSize+1;
  if(blockStart+blockSize-1>song.measureCount) blockStart=Math.max(1,song.measureCount-blockSize+1);

  const left=24,right=20,top=34;
  const available=width-left-right;
  const registry=[];
  let systems=[];
  for(let s=0;s<SYSTEMS_VISIBLE;s++){
    const start=blockStart+s*SYSTEM_MEASURES;
    if(start>song.measureCount) break;
    const y=top+s*SYSTEM_GAP;
    const firstHeader=(s===0); // each visible system needs clef/key; time only first system of piece
    // reserve more width at system start for clef/key/time
    const headerExtra=48;
    const base=(available-headerExtra)/SYSTEM_MEASURES;
    let x=left;
    let systemMeasures=[];
    for(let i=0;i<SYSTEM_MEASURES;i++){
      const no=start+i;if(no>song.measureCount)break;
      const w=base+(i===0?headerExtra:0);
      const st=makeMeasure(ctx,x,y,w,no,i===0,no===1,registry);
      systemMeasures.push({no,x,w,st}); x+=w;
    }
    systems.push({start,y,measures:systemMeasures});
  }

  drawTies(ctx,registry);

  // tempo and pedal markings only where they occur in displayed block
  if(blockStart===1){
    try{ctx.save();ctx.setFont('Times New Roman',13,'bold');ctx.fillText('Lent et douloureux  ♩ = 76',left+5,20);ctx.restore();}catch(_){ }
    try{ctx.save();ctx.setFont('Times New Roman',11,'italic');ctx.fillText('Ped. sim.',left+62,top+STAFF_GAP+68);ctx.restore();}catch(_){ }
  }

  // current-position cursor: anchored to the actual formatted note x when possible.
  const sys=systems.find(ss=>group.measure>=ss.start && group.measure<ss.start+SYSTEM_MEASURES);
  if(sys){
    const mm=sys.measures.find(m=>m.no===group.measure);
    if(mm){
      const fallback=mm.x+mm.w*0.55;
      const cx=eventX(registry,group.measure,Number(group.offsetBeats),fallback);
      const y1=mm.st.treble.getYForLine(0)-15;
      const y2=mm.st.bass.getYForLine(4)+16;
      try{ctx.save();ctx.setStrokeStyle('#d97706');ctx.setLineWidth(2.2);ctx.beginPath();ctx.moveTo(cx,y1);ctx.lineTo(cx,y2);ctx.stroke();ctx.restore();}catch(_){ }
    }
  }
}

window.renderSightScore=function(activeIndex){try{render(activeIndex);return 'ok';}catch(e){showError(e);return String(e);}};
function showError(e){const root=document.getElementById('score');root.innerHTML='';const box=document.getElementById('error');box.style.display='block';box.textContent='악보 렌더링 오류: '+(e&&e.message?e.message:e);}
try{render(0);}catch(e){showError(e);}
window.addEventListener('resize',()=>{try{render(currentActiveIndex);}catch(e){showError(e);}});
})();
</script>

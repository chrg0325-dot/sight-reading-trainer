<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%;}
#score{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
svg{display:block;overflow:visible;}
</style>
</head>
<body>
<div id="score"></div>
<script src="vexflow.js"></script>
<script>
(function(){
  const VF = Vex.Flow;

  function applyState(note, state) {
    if (state === 'done') note.setStyle({fillStyle:'#B6BBC3', strokeStyle:'#B6BBC3'});
    else if (state === 'future') note.setStyle({fillStyle:'#737B87', strokeStyle:'#737B87'});
    else note.setStyle({fillStyle:'#111827', strokeStyle:'#111827'});
    return note;
  }

  function makeSingleNote(spec) {
    const note = new VF.StaveNote({clef: spec.clef, keys:[spec.key], duration:'q'});
    if (spec.accidental) note.addModifier(new VF.Accidental(spec.accidental), 0);
    return applyState(note, spec.state);
  }

  function makeChordNote(group, clef) {
    const specs = group.slice().sort(function(a,b){
      const oa = parseInt(a.key.split('/')[1],10), ob = parseInt(b.key.split('/')[1],10);
      if (oa !== ob) return oa-ob;
      const order = {c:0,d:1,e:2,f:3,g:4,a:5,b:6};
      return order[a.key[0]]-order[b.key[0]];
    });
    const note = new VF.StaveNote({clef: clef, keys:specs.map(s=>s.key), duration:'q'});
    specs.forEach(function(spec, index){
      if (spec.accidental) note.addModifier(new VF.Accidental(spec.accidental), index);
    });
    return applyState(note, specs[0] ? specs[0].state : 'current');
  }

  function renderStaff(payload, root, width, height) {
    const isSingle = !!payload.single;
    const staveWidth = isSingle ? Math.min(380, Math.max(300, width * 0.44)) : Math.max(360, width - 70);
    const staveX = isSingle ? (width - staveWidth) / 2 : 35;
    const staveY = Math.max(40, (height - 120) / 2);
    const renderer = new VF.Renderer(root, VF.Renderer.Backends.SVG);
    renderer.resize(width, height);
    const ctx = renderer.getContext();
    ctx.setFillStyle('#111827');
    ctx.setStrokeStyle('#111827');

    const stave = new VF.Stave(staveX, staveY, staveWidth);
    stave.addClef(payload.clef || 'treble');
    stave.setContext(ctx).draw();

    const groups = payload.groups || [];
    const notes = groups.map(g => makeSingleNote(g[0])).filter(Boolean);
    if (!notes.length) return;
    const voice = new VF.Voice({num_beats: notes.length, beat_value: 4});
    voice.setStrict(false);
    voice.addTickables(notes);
    const formatWidth = isSingle ? Math.max(130, staveWidth - 150) : Math.max(180, staveWidth - 125);
    new VF.Formatter().joinVoices([voice]).format([voice], formatWidth);
    if (isSingle && notes[0]) notes[0].setXShift(Math.max(12, staveWidth * 0.10));
    voice.draw(ctx, stave);
  }

  function renderChord(payload, root, width, height) {
    const staveWidth = Math.min(430, Math.max(320, width * 0.50));
    const staveX = (width - staveWidth) / 2;
    const staveY = Math.max(40, (height - 120) / 2);
    const renderer = new VF.Renderer(root, VF.Renderer.Backends.SVG);
    renderer.resize(width, height);
    const ctx = renderer.getContext();
    ctx.setFillStyle('#111827');
    ctx.setStrokeStyle('#111827');

    const clef = payload.clef || 'treble';
    const stave = new VF.Stave(staveX, staveY, staveWidth);
    stave.addClef(clef);
    stave.setContext(ctx).draw();

    const group = (payload.groups || [])[0] || [];
    if (!group.length) return;
    const note = makeChordNote(group, clef);
    const voice = new VF.Voice({num_beats:1, beat_value:4});
    voice.setStrict(false);
    voice.addTickables([note]);
    new VF.Formatter().joinVoices([voice]).format([voice], Math.max(150, staveWidth - 160));
    note.setXShift(Math.max(14, staveWidth * 0.10));
    voice.draw(ctx, stave);
  }

  function renderGrand(payload, root, width, height) {
    const isSingle = !!payload.single;
    const renderer = new VF.Renderer(root, VF.Renderer.Backends.SVG);
    renderer.resize(width, height);
    const ctx = renderer.getContext();
    ctx.setFillStyle('#111827');
    ctx.setStrokeStyle('#111827');

    const staveWidth = isSingle ? Math.min(470, Math.max(360, width * 0.56)) : Math.max(430, width - 80);
    const staveX = isSingle ? (width - staveWidth) / 2 : 40;
    const centerY = height / 2;
    const trebleY = Math.max(28, centerY - 108);
    const bassY = trebleY + 112;

    const treble = new VF.Stave(staveX, trebleY, staveWidth).addClef('treble');
    const bass = new VF.Stave(staveX, bassY, staveWidth).addClef('bass');
    treble.setContext(ctx).draw();
    bass.setContext(ctx).draw();

    try {
      new VF.StaveConnector(treble, bass)
        .setType(VF.StaveConnector.type.BRACE)
        .setContext(ctx).draw();
      new VF.StaveConnector(treble, bass)
        .setType(VF.StaveConnector.type.SINGLE_LEFT)
        .setContext(ctx).draw();
    } catch (_) {}

    const groups = payload.groups || [];
    const trebleNotes = [];
    const bassNotes = [];
    groups.forEach(function(group){
      const t = group.find(x=>x.clef==='treble');
      const b = group.find(x=>x.clef==='bass');
      if (t && b) {
        trebleNotes.push(makeSingleNote(t));
        bassNotes.push(makeSingleNote(b));
      }
    });
    if (!trebleNotes.length || trebleNotes.length !== bassNotes.length) return;

    const tv = new VF.Voice({num_beats:trebleNotes.length, beat_value:4});
    const bv = new VF.Voice({num_beats:bassNotes.length, beat_value:4});
    tv.setStrict(false); bv.setStrict(false);
    tv.addTickables(trebleNotes); bv.addTickables(bassNotes);
    const formatWidth = isSingle ? Math.max(170, staveWidth - 170) : Math.max(220, staveWidth - 135);
    new VF.Formatter().joinVoices([tv,bv]).format([tv,bv], formatWidth);
    if (isSingle) {
      trebleNotes[0].setXShift(Math.max(14, staveWidth * 0.08));
      bassNotes[0].setXShift(Math.max(14, staveWidth * 0.08));
    }
    tv.draw(ctx, treble);
    bv.draw(ctx, bass);
  }

  window.renderSightNotes = function(payload){
    try {
      const root = document.getElementById('score');
      root.innerHTML = '';
      const width = Math.max(420, Math.min(900, window.innerWidth || 700));
      const wantedHeight = payload.layout === 'grand' ? 390 : 300;
      const height = Math.max(payload.layout === 'grand' ? 280 : 190,
                              Math.min(wantedHeight, window.innerHeight || wantedHeight));
      if (payload.layout === 'grand') renderGrand(payload, root, width, height);
      else if (payload.layout === 'chord') renderChord(payload, root, width, height);
      else renderStaff(payload, root, width, height);
      return 'ok';
    } catch(e) {
      document.getElementById('score').innerText = '악보 렌더링 오류';
      return String(e);
    }
  };
})();
</script>
</body>
</html>

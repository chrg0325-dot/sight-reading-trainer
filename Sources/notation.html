<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%;}
#score{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
svg{display:block;overflow:visible;}
</style>
</head>
<body>
<div id="score"></div>
<script src="vexflow.js"></script>
<script>
(function(){
  const VF = Vex.Flow;
  function makeNote(spec) {
    const note = new VF.StaveNote({clef: spec.clef, keys:[spec.key], duration:'q'});
    if (spec.accidental) note.addModifier(new VF.Accidental(spec.accidental), 0);
    if (spec.state === 'done') note.setStyle({fillStyle:'#B6BBC3', strokeStyle:'#B6BBC3'});
    else if (spec.state === 'future') note.setStyle({fillStyle:'#737B87', strokeStyle:'#737B87'});
    else note.setStyle({fillStyle:'#111827', strokeStyle:'#111827'});
    return note;
  }

  window.renderSightNotes = function(payload){
    try {
      const root = document.getElementById('score');
      root.innerHTML = '';
      const width = Math.max(420, Math.min(900, window.innerWidth || 700));
      const height = Math.max(190, Math.min(300, window.innerHeight || 240));
      const renderer = new VF.Renderer(root, VF.Renderer.Backends.SVG);
      renderer.resize(width, height);
      const ctx = renderer.getContext();
      ctx.setFillStyle('#111827');
      ctx.setStrokeStyle('#111827');

      // 단음은 실제 한 문제 카드처럼 짧은 오선을 중앙에 배치하고,
      // 4음 연속은 여러 음을 읽기 편하도록 넓은 오선을 사용한다.
      const isSingle = !!payload.single;
      const staveWidth = isSingle ? Math.min(380, Math.max(300, width * 0.44)) : Math.max(360, width - 70);
      const staveX = isSingle ? (width - staveWidth) / 2 : 35;
      const staveY = Math.max(40, (height - 120) / 2);
      const stave = new VF.Stave(staveX, staveY, staveWidth);
      stave.addClef(payload.clef || 'treble');
      stave.setContext(ctx).draw();

      const notes = (payload.notes || []).map(makeNote);
      if (!notes.length) return 'ok';
      const voice = new VF.Voice({num_beats: notes.length, beat_value: 4});
      voice.setStrict(false);
      voice.addTickables(notes);

      const formatWidth = isSingle ? Math.max(130, staveWidth - 150) : Math.max(180, staveWidth - 125);
      new VF.Formatter().joinVoices([voice]).format([voice], formatWidth);
      if (isSingle && notes[0]) notes[0].setXShift(Math.max(12, staveWidth * 0.10));
      voice.draw(ctx, stave);
      return 'ok';
    } catch(e) {
      document.getElementById('score').innerText = '악보 렌더링 오류';
      return String(e);
    }
  };
})();
</script>
</body>
</html>

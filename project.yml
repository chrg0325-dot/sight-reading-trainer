name: SightReadingTrainer

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

targets:
  SightReadingTrainer:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sightreadingtrainer
        PRODUCT_NAME: SightReadingTrainer
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_STYLE: Automatic

name: SightReadingTrainer

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

targets:
  SightReadingTrainer:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Audio
          - Vendor
    resources:
      - path: Sources/notation.html
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sightreadingtrainer
        PRODUCT_NAME: SightReadingTrainer
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/Info.plist
